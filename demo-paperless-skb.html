            <rect x="10" y="0" width="56" height="10" rx="4" fill="#475569"/>
            <rect x="0" y="28" width="76" height="16" fill="#F59E0B"/>
            <text x="38" y="40" text-anchor="middle" fill="#0F172A" font-family="monospace" font-size="10" font-weight="bold">KEG #${String(i + 1).padStart(2, '0')}</text>
            <text x="38" y="59" text-anchor="middle" fill="#E2E8F0" font-family="monospace" font-size="9">20 LÍT</text>
          </g>
        `;
      }).join('');
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" width="600" height="280">
        <rect width="600" height="280" fill="#0F172A"/>
        <rect x="16" y="12" width="568" height="44" rx="8" fill="#1E293B" stroke="#D99B26" stroke-width="1.5"/>

        ${kegs}
      </svg>`;
      return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
    }

    function makeTankGaugePhotoSvg(tankId, liters, maxCap, batchCode) {

        <text x="255" y="152" fill="#FBBF24" font-family="monospace" font-size="12">Mã lô đang chứa: ${batchCode}</text>

      </svg>`;

    function generateToken(code, role, email, time) {
      const str = `${code}|${role}|${email}|${time}`;
      let h = 0x811c9dc5;
      for (let i = 0; i < str.length; i++) {
        h ^= str.charCodeAt(i);
        h = Math.imul(h, 0x01000193);
      }
      const hex = (h >>> 0).toString(16).toUpperCase().padStart(8, '0');
      return `${hex.slice(0, 4)}-${hex.slice(4, 8)}`;
    }

    function formatKegText(p, qty) {
      if (!qty || qty <= 0) return '—';
      if (p.category === 'Lít') {

        return Math.abs(k - Math.round(k)) < 0.001 ? `${Math.round(k)} Keg` : `${k.toFixed(1)} Keg`;
      }
      const pk = qty / (p.packSize || 24);
      return Math.abs(pk - Math.round(pk)) < 0.001 ? `${Math.round(pk)} Thùng` : `${pk.toFixed(1)} Thùng`;
    }

    // 4. TÍNH TOÁN NHẬP - XUẤT - TỒN & ĐỐI CHIẾU KẾ HOẠCH REALTIME
    // =========================================================================
    function computeWarehouseNXT() {
      const byProduct = {};
      PRODUCTS.forEach(p => {
        byProduct[p.id] = { product: p, opening: 0, imported: 0, pendingImport: 0, exported: 0, loss: 0, closing: 0 };
      });

      const byLot = new Map(); // key: productId|batchNumber
      const ensureLot = (productId, batchNumber) => {
        const key = `${productId}|${batchNumber}`;
        if (!byLot.has(key)) {
          byLot.set(key, { product: getProduct(productId), batchNumber, opening: 0, imported: 0, exported: 0, loss: 0, closing: 0, slipCode: 'Tồn đầu kỳ' });
        }
        return byLot.get(key);
      };

      openingStocks.forEach(o => {
        if (byProduct[o.productId]) byProduct[o.productId].opening += o.qty;
        const lot = ensureLot(o.productId, o.batchNumber);
        lot.opening += o.qty;
      });

      slips.forEach(s => {
        if (s.status === 'signed') {
          s.items.forEach(i => {
            if (byProduct[i.productId]) byProduct[i.productId].imported += i.quantity;
            const lot = ensureLot(i.productId, i.batchNumber);
            lot.imported += i.quantity;
            lot.slipCode = s.code;
          });
        } else if (s.status === 'cho_ql_xuong' || s.status === 'cho_kho_tong') {
          s.items.forEach(i => {
            if (byProduct[i.productId]) byProduct[i.productId].pendingImport += i.quantity;
          });
        }
      });

      exportOrders.forEach(ex => {
        if (byProduct[ex.productId]) {
          byProduct[ex.productId].exported += ex.qty;
          byProduct[ex.productId].loss += ex.loss;
        }
        const lot = ensureLot(ex.productId, ex.batchNumber);
        lot.exported += ex.qty;
        lot.loss += ex.loss;
      });

      Object.values(byProduct).forEach(r => {
        r.closing = r.opening + r.imported - r.exported - r.loss;
      });
      byLot.forEach(l => {
        l.closing = l.opening + l.imported - l.exported - l.loss;
      });

      return { byProduct: Object.values(byProduct), byLot: Array.from(byLot.values()) };
    }

    // Tổng hợp Tiến độ Kế hoạch sản xuất vs Thực xuất xưởng vs Thực xuất Kho tổng
    function computePlanProgress() {
      return productionPlans.map(plan => {
        const p = getProduct(plan.productId);
        // Tổng xưởng đã giao (gồm cả chờ duyệt & đã duyệt, trừ bị trả lại)
        let sentFromBrewery = 0;
        let receivedByWarehouse = 0;
        slips.forEach(s => {
          if (s.status === 'tra_lai') return;
          s.items.forEach(i => {
            if (i.productId === plan.productId) {
              sentFromBrewery += i.quantity;
              if (s.status === 'signed') receivedByWarehouse += i.quantity;
            }
          });
        });
        const soldOut = exportOrders
          .filter(e => e.productId === plan.productId)
          .reduce((sum, e) => sum + e.qty, 0);

        const pctBrewery = plan.targetQty > 0 ? Math.round((sentFromBrewery / plan.targetQty) * 100) : 0;
        const pctReceived = plan.targetQty > 0 ? Math.round((receivedByWarehouse / plan.targetQty) * 100) : 0;
        const variance = receivedByWarehouse - plan.targetQty;

        return { plan, product: p, sentFromBrewery, receivedByWarehouse, soldOut, pctBrewery, pctReceived, variance };
      });
    }

    function showToast(msg, type = 'success') {
      const box = document.getElementById('toast-container');
      const id = 't-' + Date.now();
      const colors = {
        success: 'bg-slate-900 text-white border-emerald-500/60',
        warn: 'bg-amber-950 text-amber-100 border-amber-400/60',
        error: 'bg-rose-950 text-rose-100 border-rose-500/60'
      }[type];
      const div = document.createElement('div');
      div.id = id;
      div.className = `pointer-events-auto px-4 py-3 rounded-2xl border shadow-2xl text-xs font-bold flex items-center gap-2.5 anim-toast ${colors}`;
      div.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-400 pulse-dot"></span><span>${msg}</span>`;
      box.appendChild(div);
      setTimeout(() => {
        div.style.opacity = '0';
        div.style.transform = 'translateX(20px)';
        div.style.transition = 'all 0.25s ease';
        setTimeout(() => div.remove(), 260);
      }, 3400);
    }

    function renderKeToanView() {
      const tab = subTabs.KE_TOAN;
      if (tab === 'truy_xuat_lo') return renderKtTruyXuatLo();
      return renderKtDashboard();

    function renderKtDashboard() {
      const progress = computePlanProgress();
      const { byProduct } = computeWarehouseNXT();

      // Quy đổi sang Lít để cộng tổng toàn cục
      const totalPlanL = progress.reduce((s, x) => s + x.plan.targetQty * (x.product.cap / 1000), 0);
      const totalSentL = progress.reduce((s, x) => s + x.sentFromBrewery * (x.product.cap / 1000), 0);
      const totalRecL = progress.reduce((s, x) => s + x.receivedByWarehouse * (x.product.cap / 1000), 0);
      const totalSoldL = byProduct.reduce((s, r) => s + r.exported * (r.product.cap / 1000), 0);
      const totalClosingL = byProduct.reduce((s, r) => s + r.closing * (r.product.cap / 1000), 0);
      const totalTankL = tankInventories.reduce((s, k) => s + k.liters, 0);
      const planRate = totalPlanL > 0 ? Math.round((totalRecL / totalPlanL) * 100) : 0;

      return `
        <div class="space-y-6 anim-view-enter">
          <!-- 4 KPI Kế Toán & Vận Hành -->
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">

              <p class="text-2xl font-black font-mono text-emerald-700 mt-1 tabular-nums">${totalRecL.toFixed(0)} <span class="text-sm font-bold">Lít</span></p>
              <p class="text-[11px] text-slate-500 mt-1">Đạt <strong class="text-emerald-700">${planRate}%</strong> kế hoạch ngày</p>
            </div>
            <div class="p-5 rounded-3xl bg-white border border-sky-200 shadow-sm card-lift">
              <span class="text-[10px] font-extrabold uppercase tracking-widest text-sky-700">THỰC XUẤT BÁN & NỘI BỘ</span>
              <p class="text-2xl font-black font-mono text-sky-700 mt-1 tabular-nums">${totalSoldL.toFixed(0)} <span class="text-sm font-bold">Lít</span></p>
              <p class="text-[11px] text-slate-500 mt-1">${exportOrders.length} chuyến đi BNC & Đối tác</p>
            </div>
            <div class="p-5 rounded-3xl bg-white border border-amber-200 shadow-sm card-lift">

    function getActiveFormItems() {
      return PRODUCTS
        .filter(p => (Number(formQuantities[p.id]) || 0) > 0)
        .map(p => {
          const quantity = Number(formQuantities[p.id]) || 0;
          const batchNumber = (formBatches[p.id] || '').trim() || formCommonBatch.trim();
          return {
            productId: p.id,
            productName: p.name,
            unit: p.unit,
            category: p.category,
            quantity,
            liters: (quantity * p.cap) / 1000,
            kegText: formatKegText(p, quantity),
            batchNumber
          };
        });
    }

    function prefillFromPlan() {
      const progress = computePlanProgress();
      formQuantities = {};
      formBatches = {};
      progress.forEach(({ plan, sentFromBrewery }) => {
        const remain = Math.max(0, plan.targetQty - sentFromBrewery);
        if (remain > 0) {
          formQuantities[plan.productId] = remain;
          formBatches[plan.productId] = plan.batchHint;
        }
      });
      if (!attachedPhotos.length) addSimulatedKegPhoto();
      showToast('Đã kế thừa phần sản lượng còn thiếu từ Kế hoạch sản xuất!');
      renderMainStage();
    }

    function addSimulatedKegPhoto() {
      const items = getActiveFormItems();
      const totalL = items.reduce((s, i) => s + i.liters, 0) || 200;
      const kegs = items.filter(i => i.category === 'Lít').reduce((s, i) => s + Math.round(i.quantity / 20), 0) || 10;
      const batch = items[0]?.batchNumber || formCommonBatch || 'LO-261116-GB01';
      attachedPhotos.push({
        id: 'ph-' + Date.now(),
        caption: `Hiện trạng ${kegs} Keg (${totalL.toFixed(0)}L) · ${batch}`,
        url: makeKegPhotoSvg(kegs, totalL.toFixed(0), batch, '16/11 14:30')
      });
      renderMainStage();
    }

    function handleRealPhotoUpload(e) {
      Array.from(e.target.files || []).forEach(f => {
        const rd = new FileReader();
        rd.onload = ev => {
          attachedPhotos.push({ id: 'real-' + Date.now(), caption: f.name, url: ev.target.result });
          renderMainStage();
        };
        rd.readAsDataURL(f);
      });
      e.target.value = '';
    }

    function submitSlip() {
      const items = getActiveFormItems();
      if (!items.length || items.some(i => !i.batchNumber) || !attachedPhotos.length) return;
      const timeStr = '16/11/2026 ' + new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });
      const code = editingSlipCode || `PN-261116-${String(slips.length + 1).padStart(2, '0')}`;
      const token = generateToken(code, 'SAN_XUAT', 'hung.nv@sunworld.vn', timeStr);

      const newSlip = {
        code,
        dateKey: formDate,
        seq: slips.length + 1,
        status: 'cho_ql_xuong',
        items,
        photos: [...attachedPhotos],
        rejectedBy: null,
        rejectedReason: null,
        signatures: {
          creator: { name: 'Nguyễn Văn Hùng', email: 'hung.nv@sunworld.vn', signedAt: timeStr, token },
          manager: null,
          warehouse: null
        }
      };

      if (editingSlipCode) {
        slips = slips.map(s => s.code === editingSlipCode ? newSlip : s);
        editingSlipCode = null;
        showToast(`Đã trình lại phiếu ${code} lên Quản lý xưởng!`);
      } else {
        slips.unshift(newSlip);
        showToast(`Đã lập phiếu ${code} & gửi Quản lý xưởng (Rào 1)!`);
      }

      formQuantities = {};
      formBatches = {};
      attachedPhotos = [];
      subTabs.QUAN_LY_XUONG = 'duyet_nhat_ky';
      switchRole('QUAN_LY_XUONG');
    }

      const token = generateToken(code, 'QUAN_LY_XUONG', 'duc.tm@sunworld.vn', timeStr);
      slips = slips.map(s => s.code !== code ? s : {
        ...s,
        status: 'cho_kho_tong',

    function rejectSlip(code, byLabel) {
      const reason = window.prompt(`Lý do trả lại phiếu ${code}:`, 'Thực tế đếm thiếu 1 Keg so với số ghi trên phiếu');
      if (!reason || !reason.trim()) return;
      slips = slips.map(s => s.code !== code ? s : {

        status: 'tra_lai',
        rejectedBy: byLabel,
        rejectedReason: reason.trim(),
        signatures: { ...s.signatures, manager: null, warehouse: null }

      showToast(`Đã trả lại phiếu ${code} về cho NV Sản xuất`, 'warn');
      renderAll();

        source: '🤖 Agent bóc từ Mail',
        batchHint: 'LO-261116-EC01',
        note: 'Tự động bóc từ email Kế hoạch sản xuất tuần',
        published: true
      });
      showToast('🤖 Agent vừa đồng bộ thêm kế hoạch Eclipse Plaza Wheat từ Email!');
      renderMainStage();
    }

    function submitExportOrder() {
      const [productId, batchNumber] = document.getElementById('exp-lot').value.split('|');
      const destination = document.getElementById('exp-dest').value;
      const qty = Number(document.getElementById('exp-qty').value) || 0;
      if (!productId || qty <= 0) return;

      const id = `PX-261116-${String(exportOrders.length + 1).padStart(2, '0')}`;
      exportOrders.unshift({ id, date: '2026-11-16', destination, productId, batchNumber, qty, loss: 0, by: 'Lê Quốc Bảo' });
      showToast(`Đã xuất ${qty} đơn vị lô ${batchNumber} tới ${destination}!`);
      renderMainStage();
    }

    // =========================================================================
    // 12. MODAL BIỂU MẪU PAPERLESS BM-SKB-01
    // =========================================================================
    function openPaperlessModal(code) {
      const s = slips.find(x => x.code === code);
      if (!s) return;
      document.getElementById('modal-slip-title').textContent = `Biểu mẫu điện tử BM-SKB-01 · ${s.code}`;
      const sigCell = (title, sig) => sig ? `
        <div class="p-3.5 rounded-xl border-2 border-emerald-600/80 bg-emerald-50/40 text-center space-y-1">
          <p class="text-[11px] font-extrabold uppercase text-slate-700">${title}</p>
          <p class="text-xs font-black text-emerald-700">✓ Đã ký điện tử</p>
          <p class="text-[11px] font-mono text-slate-600">${sig.signedAt}</p>
          <p class="text-[10px] font-mono font-bold text-emerald-900 bg-emerald-100 rounded px-1.5 py-0.5 inline-block">TOKEN: ${sig.token}</p>
          <p class="text-xs font-black text-slate-900 pt-1">${sig.name}</p>
        </div>
      ` : `
        <div class="p-3.5 rounded-xl border-2 border-dashed border-slate-300 bg-slate-50 text-center flex flex-col justify-center min-h-[130px]">
          <p class="text-[11px] font-extrabold uppercase text-slate-500">${title}</p>
          <p class="text-xs text-slate-400 mt-2">Chưa ký điện tử</p>
        </div>
      `;

      document.getElementById('paperless-doc').innerHTML = `
        <div class="flex justify-between items-start border-b-2 border-slate-900 pb-4 text-xs">
          <div>
            <p class="font-black uppercase text-[#8B1E1E]">SUN WORLD BA NA HILLS · SUN KRAFTBEER</p>
            <p class="text-slate-500">Số hiệu biểu mẫu: <strong class="font-mono">BM-SKB-01</strong></p>
          </div>
          <div class="text-right">
            <p class="font-black uppercase">CÔNG TY CỔ PHẦN DỊCH VỤ CÁP TREO BÀ NÀ</p>
            <p class="font-mono font-bold mt-0.5">Số phiếu: ${s.code} · Ngày: ${s.dateKey.split('-').reverse().join('/')}</p>
          </div>
        </div>
        <h2 class="text-center text-lg font-black uppercase">PHIẾU BÀN GIAO & NHẬP KHO TỔNG THEO LÔ</h2>
        <table class="w-full border-collapse border border-slate-900 text-xs">
          <thead class="bg-slate-100">
            <tr>
              <th class="border border-slate-900 p-2">STT</th>
              <th class="border border-slate-900 p-2 text-left">Tên bia</th>
              <th class="border border-slate-900 p-2">Mã lô</th>
              <th class="border border-slate-900 p-2 text-right">Số lượng</th>
              <th class="border border-slate-900 p-2 text-center">Hiện trạng</th>
            </tr>
          </thead>
          <tbody>
            ${s.items.map((it, idx) => `
              <tr>
                <td class="border border-slate-900 p-2 text-center">${idx + 1}</td>
                <td class="border border-slate-900 p-2 font-bold">${it.productName}</td>
                <td class="border border-slate-900 p-2 text-center font-mono font-bold">${it.batchNumber}</td>
                <td class="border border-slate-900 p-2 text-right font-mono font-bold">${it.quantity} ${it.unit}</td>
                <td class="border border-slate-900 p-2 text-center font-mono">${it.kegText}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
        <div>
          <p class="text-xs font-bold mb-2">Ảnh chụp hiện trạng bàn giao (${s.photos.length} ảnh):</p>
          ${s.photos.map(ph => `<img src="${ph.url}" class="w-full max-h-56 object-contain bg-slate-950 rounded-xl border border-slate-300" />`).join('')}
        </div>
        <div class="grid grid-cols-3 gap-3 pt-2">
          ${sigCell('1. Người Lập (Sản xuất)', s.signatures.creator)}
          ${sigCell('2. Quản Lý Xưởng (Rào 1)', s.signatures.manager)}
          ${sigCell('3. Kho Tổng Nhận (Rào 2)', s.signatures.warehouse)}
        </div>
      `;
      document.getElementById('modal-paperless').classList.remove('hidden');
    }

    function closePaperlessModal() {
      document.getElementById('modal-paperless').classList.add('hidden');
    }

    function renderMainStage() {
      const stage = document.getElementById('main-stage');
      if (currentRole === 'SAN_XUAT') stage.innerHTML = renderSanXuatView();
      else if (currentRole === 'QUAN_LY_XUONG') stage.innerHTML = renderQuanLyXuongView();
      else if (currentRole === 'KHO_TONG') stage.innerHTML = renderKhoTongView();
      else stage.innerHTML = renderKeToanView();
    }

    function renderAll() {
      renderHeaderBadges();
      renderSubBar();
      renderMainStage();
    }

    window.addEventListener('keydown', e => { if (e.key === 'Escape') closePaperlessModal(); });

    seedInitialData();
    renderAll();
  </script>
</body>
</html>
